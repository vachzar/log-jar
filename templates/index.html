<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
</head>
<body>
  <h1>{{ config.title }}</h1>
  <p>{{ config.description }}</p>
  <hr>
  <h2>Posts</h2>
  <ul>
  {% for page in section.pages %}
    <li><a href="{{ page.permalink }}">{{ page.title }}</a> <small>{{ page.date }}</small></li>
  {% endfor %}
  </ul>
</body>
</html>
